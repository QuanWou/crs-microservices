spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/$\{segment}

            - id: auth-service-api-keys-list
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/api-keys
              filters:
                - RewritePath=/api/api-keys, /api-keys

            - id: auth-service-api-keys-detail
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/api-keys/**
              filters:
                - RewritePath=/api/api-keys/(?<segment>.*), /api-keys/$\{segment}

            - id: course-service-list
              uri: ${COURSE_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/courses
              filters:
                - RewritePath=/api/courses, /courses

            - id: course-service-detail
              uri: ${COURSE_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/courses/**
              filters:
                - RewritePath=/api/courses/(?<segment>.*), /courses/$\{segment}

            - id: registration-service-list
              uri: ${REGISTRATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/registrations
              filters:
                - RewritePath=/api/registrations, /registrations

            - id: registration-service-detail
              uri: ${REGISTRATION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/registrations/**
              filters:
                - RewritePath=/api/registrations/(?<segment>.*), /registrations/$\{segment}

            - id: course-service-partner
              uri: ${COURSE_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/public/courses,/api/public/courses/**
              filters:
                - RewritePath=/api/public/courses(?<segment>/?.*), /courses$\{segment}

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: ${FRONTEND_ORIGIN:http://localhost:5173}
                allowedMethods: '*'
                allowedHeaders: '*'

server:
  port: 8080

services:
  auth:
    base-url: ${AUTH_SERVICE_URL:http://localhost:8081}

api-key:
  cache-ttl-seconds: ${API_KEY_CACHE_TTL_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
